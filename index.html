<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hisobchi Liga</title>
<meta name="theme-color" content="#7C5CFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F2FF; --dot:#E0D8FF; --card:#FFFFFF; --line:#E4DCFF; --shade:#D9CFFF;
  --ink:#4B2FD6; --text:#241F40; --muted:#6F6796;
  --coral:#FF6B5A; --amber:#FFB020; --teal:#0FB8A1; --violet:#7C5CFF; --pink:#FF5FA2; --lime:#4CC14B; --sky:#2FA8FF; --plum:#B054FF;
  --ok:#0FA25C; --ok-bg:#E0F8EC; --bad:#E8433B; --bad-bg:#FFE6E3; --gold:#FFB020;
  --display:"Baloo 2","Segoe UI",system-ui,sans-serif;
  --ui:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15123A; --dot:#241F55; --card:#1F1B4A; --line:#332C6B; --shade:#120F30;
    --ink:#C6B6FF; --text:#F0EDFF; --muted:#A49CD1;
    --ok:#3EDD8C; --ok-bg:#12372A; --bad:#FF7E72; --bad-bg:#3D1C24; --gold:#FFC44D;
  }
}
:root[data-theme="dark"]{--bg:#15123A;--dot:#241F55;--card:#1F1B4A;--line:#332C6B;--shade:#120F30;--ink:#C6B6FF;--text:#F0EDFF;--muted:#A49CD1;--ok:#3EDD8C;--ok-bg:#12372A;--bad:#FF7E72;--bad-bg:#3D1C24;}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  background-image:radial-gradient(var(--dot) 1.6px, transparent 1.6px);
  background-size:20px 20px;
  color:var(--text); font-family:var(--ui); font-size:17px; line-height:1.5; min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
body::before{content:""; position:fixed; inset:-20% -20% auto -20%; height:70vh; z-index:-2; pointer-events:none;
  background:radial-gradient(45% 45% at 20% 25%, rgba(124,92,255,.45), transparent 70%),
             radial-gradient(40% 40% at 80% 15%, rgba(47,168,255,.38), transparent 70%),
             radial-gradient(45% 45% at 60% 60%, rgba(255,95,162,.30), transparent 70%);
  filter:blur(40px); animation:aurora 18s ease-in-out infinite alternate}
body::after{content:""; position:fixed; inset:auto -20% -25% -20%; height:55vh; z-index:-2; pointer-events:none;
  background:radial-gradient(40% 40% at 30% 70%, rgba(15,184,161,.32), transparent 70%),
             radial-gradient(40% 40% at 75% 60%, rgba(255,176,32,.30), transparent 70%);
  filter:blur(46px); animation:aurora 22s ease-in-out infinite alternate-reverse}
@keyframes aurora{0%{transform:translate3d(-4%,-2%,0) scale(1)}50%{transform:translate3d(5%,3%,0) scale(1.12)}100%{transform:translate3d(-2%,4%,0) scale(1.05)}}
.wrap{max-width:560px; margin:0 auto; padding:12px 14px 124px}
.wrap>*{animation:rise .5s cubic-bezier(.2,.8,.3,1) both}
.wrap>*:nth-child(2){animation-delay:.05s} .wrap>*:nth-child(3){animation-delay:.1s}
.wrap>*:nth-child(4){animation-delay:.15s} .wrap>*:nth-child(5){animation-delay:.2s}
.wrap>*:nth-child(6){animation-delay:.25s} .wrap>*:nth-child(7){animation-delay:.3s}
@keyframes rise{from{opacity:0; transform:translateY(18px) scale(.98)}to{opacity:1; transform:none}}
@keyframes popin{from{opacity:0; transform:scale(.8)}to{opacity:1; transform:none}}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.shake{animation:shake .5s both}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
.ring{position:relative; width:170px; height:170px; margin:4px auto 6px}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring circle{fill:none; stroke-width:13; stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.22)}
.ring .fg{stroke:#fff; stroke-dasharray:327; stroke-dashoffset:327; transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.3,1)}
.ring-t{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center}
.ring-t b{font-family:var(--display); font-size:38px; line-height:1}
.ring-t i{font-style:normal; font-size:14px; font-weight:700; opacity:.9}
.podium{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; align-items:end; margin:8px 0 4px}
.pod{border-radius:16px 16px 0 0; padding:10px 6px 12px; text-align:center; color:#fff; animation:rise .6s both}
.pod span{display:block; font-size:24px}
.pod b{display:block; font-size:14px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pod i{font-style:normal; font-size:12px; opacity:.92}
.pod.p1{background:linear-gradient(160deg,#FFD75E,#FF9A2E); height:130px; animation-delay:.1s}
.pod.p2{background:linear-gradient(160deg,#D9DEF0,#9AA3C7); height:106px}
.pod.p3{background:linear-gradient(160deg,#F0B98C,#C67C4E); height:92px; animation-delay:.2s}
.nav button{transition:transform .18s, background .25s, color .25s}
.nav button.on{transform:translateY(-3px)}
.nav button.on span{animation:popin .3s both}
.appbar .ava{animation:popin .4s both}
.appbar{position:sticky; top:8px; z-index:5; display:flex; align-items:center; gap:11px; background:var(--card); border-radius:20px; padding:9px 13px; margin-bottom:14px; box-shadow:0 4px 0 var(--shade)}
.ava{width:42px; height:42px; border-radius:14px; background:linear-gradient(140deg,var(--violet),var(--sky)); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:800; font-size:19px}
.ttl b{display:block; font-family:var(--display); font-size:18px; line-height:1.15}
.ttl i{font-style:normal; font-size:13px; color:var(--muted); font-weight:600}
.xpchip{margin-left:auto; background:linear-gradient(135deg,var(--amber),var(--coral)); color:#fff; font-weight:800; border-radius:999px; padding:6px 13px; font-size:15px; white-space:nowrap}
.nav{max-width:532px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:6px; background:var(--card); border-radius:22px; padding:8px 6px; box-shadow:0 4px 0 var(--shade)}
.nav button{border:0; background:none; border-radius:16px; padding:7px 2px; font-size:12px; font-weight:700; color:var(--muted); display:grid; gap:3px; justify-items:center}
.nav button span{font-size:21px; line-height:1}
.nav button.on{background:linear-gradient(135deg,var(--violet),var(--sky)); color:#fff}
.dl{display:flex; align-items:center; gap:12px; border-radius:22px; padding:14px 16px; color:#fff; box-shadow:0 5px 0 rgba(0,0,0,.16); margin-bottom:14px}
.dl.open{background:linear-gradient(135deg,#FF8A3D,var(--coral))}
.dl.done{background:linear-gradient(135deg,var(--lime),var(--teal))}
.dl.missed{background:linear-gradient(135deg,#8B87A6,#5A5674)}
.dl.off{background:linear-gradient(135deg,var(--sky),var(--violet))}
.dl-l b{display:block; font-family:var(--display); font-size:19px}
.dl-l i{font-style:normal; font-size:14px; opacity:.95; font-weight:600}
.dl-r{margin-left:auto; text-align:center; font-family:var(--display); font-size:34px; line-height:1}
.dl-r span{display:block; font-size:12px; font-family:var(--ui); opacity:.92; font-weight:700}
.acts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
.act{background:var(--bg); border:0; border-radius:16px; padding:11px 8px; font-weight:700; font-size:14px; line-height:1.25; box-shadow:0 4px 0 var(--line); display:grid; gap:2px; justify-items:center; text-align:center}
.act span{font-size:24px} .act i{font-style:normal; font-size:12px; color:var(--muted); font-weight:600}
.act:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line)}
.act.dim{opacity:.5} .act.gift{background:linear-gradient(140deg,var(--amber),var(--coral)); color:#fff; box-shadow:0 4px 0 #c9500f}
.act.gift i{color:rgba(255,255,255,.9)}
.goal{background:rgba(255,255,255,.18); border-radius:16px; padding:12px; text-align:center}
.goal-n{font-family:var(--display); font-size:30px; line-height:1.1}
.goal-bar{height:12px; background:rgba(0,0,0,.18); border-radius:8px; margin:8px 0 6px; overflow:hidden}
.goal-bar i{display:block; height:100%; background:#fff; border-radius:8px; transition:width .6s}
.goal-t{font-size:14px; font-weight:700}
.tmr{background:linear-gradient(135deg,var(--coral),var(--pink)); color:#fff; font-weight:800; border-radius:999px; padding:5px 13px}
.week7{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; text-align:center}
.week7 span{border-radius:12px; padding:10px 0; font-size:12px; font-weight:800; background:var(--bg); color:var(--muted)}
.week7 .d{background:var(--ok); color:#fff} .week7 .m{background:var(--bad); color:#fff}
.week7 .s{background:var(--violet); color:#fff} .week7 .b{background:var(--amber); color:#fff}
.shop{display:flex; align-items:center; gap:10px; background:var(--bg); border-radius:16px; padding:11px 13px; margin-bottom:10px}
.shop b{display:block; font-family:var(--display); font-size:17px} .shop i{font-style:normal; font-size:13px; color:var(--muted); font-weight:600}
.buy{margin-left:auto; border:0; border-radius:999px; padding:9px 16px; font-weight:800; color:#fff; background:linear-gradient(135deg,var(--violet),var(--sky)); box-shadow:0 3px 0 #3f2bb5; white-space:nowrap}
.rules{padding-left:20px; margin:0} .rules li{margin-bottom:9px; font-size:15px}
.reg{margin-top:18px} .reglogo{font-size:58px; text-align:center} .reg h2{text-align:center}
button{font-family:inherit; font-size:inherit; color:inherit; cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--violet); outline-offset:3px}
h1,h2,h3{margin:0; line-height:1.1; font-family:var(--display); font-weight:800}
.small{font-size:14px; color:var(--muted); line-height:1.4}

.bar{display:flex; align-items:center; gap:10px; padding:4px 0 12px}
.bar .back{border:0; background:var(--card); box-shadow:0 3px 0 var(--shade); border-radius:14px; font-size:22px; width:42px; height:42px; line-height:1}
.pill{display:inline-flex; align-items:center; gap:6px; background:var(--card); border-radius:999px; padding:5px 14px; font-weight:700; font-size:15px; box-shadow:0 3px 0 var(--shade)}
.spacer{flex:1}

.hero{padding:10px 4px 2px}
.hero h1{font-size:46px; color:var(--ink); letter-spacing:-.5px}
.hero h1 span{display:inline-block; animation:wiggle 3s ease-in-out infinite}
@keyframes wiggle{0%,92%,100%{transform:rotate(0)}95%{transform:rotate(-14deg)}98%{transform:rotate(12deg)}}
.hero p{margin:6px 0 0; color:var(--muted); max-width:38ch}

.card{background:var(--card); border-radius:22px; padding:16px; margin:14px 0 0; box-shadow:0 5px 0 var(--shade)}
.card h3{font-size:19px; margin-bottom:10px; color:var(--ink)}
.rank-top{display:flex; justify-content:space-between; align-items:center; gap:8px}
.rank-top b{font-family:var(--display); font-size:24px; color:var(--ink)}
.meter{height:14px; background:var(--bg); border-radius:10px; margin-top:12px; overflow:hidden}
.meter i{display:block; height:100%; border-radius:10px; background:linear-gradient(90deg,var(--amber),var(--coral)); transition:width .6s cubic-bezier(.3,1.4,.5,1)}

.lb{display:grid; gap:8px}
.row{display:grid; grid-template-columns:36px 1fr auto; gap:10px; align-items:center; padding:9px 11px; border-radius:16px; background:var(--bg)}
.row.me{background:linear-gradient(90deg,rgba(124,92,255,.18),rgba(47,168,255,.14)); box-shadow:inset 0 0 0 2.5px var(--violet)}
.row .pos{font-size:22px; text-align:center}
.row .who{font-weight:700}
.row .who i{display:block; font-style:normal; font-size:13px; color:var(--muted); font-weight:400}
.row .xp{font-weight:800; color:var(--ink); white-space:nowrap}
.gap{margin-top:10px; font-size:15px; font-weight:600}
.gap.up{color:var(--ok)} .gap.down{color:var(--coral)}
.alert{background:linear-gradient(135deg,var(--coral),var(--pink)); color:#fff; border-radius:18px; padding:13px 15px; margin-top:14px; font-weight:700; box-shadow:0 5px 0 rgba(0,0,0,.14)}

.duo{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px}
.duo>div{border-radius:22px; padding:14px 10px; text-align:center; color:#fff; box-shadow:0 5px 0 rgba(0,0,0,.15)}
.duo>div:first-child{background:linear-gradient(140deg,#FF8A3D,var(--coral))}
.duo>div:last-child{background:linear-gradient(140deg,var(--teal),#2FA8FF)}
.duo .n{font-family:var(--display); font-size:44px; line-height:1}
.duo .small{color:rgba(255,255,255,.92); font-weight:600}

.league{background:linear-gradient(140deg,#7C5CFF,#B054FF 55%,#FF5FA2); color:#fff; border-radius:22px; padding:16px; margin-top:14px; box-shadow:0 5px 0 rgba(0,0,0,.18)}
.league h3{font-size:20px; color:#fff}
.lg-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px}
.lg-timer{background:rgba(255,255,255,.22); border-radius:999px; padding:4px 12px; font-weight:800; font-size:14px; white-space:nowrap}
.league .row{background:rgba(255,255,255,.16)}
.league .row.me{background:rgba(255,255,255,.34); box-shadow:inset 0 0 0 2.5px #fff}
.league .row .xp,.league .row .who{color:#fff}
.league .gap{color:#fff !important; font-weight:700}
.privacy{margin:10px 2px 0; font-size:13px; color:var(--muted); font-weight:600}
.lg-note{background:rgba(255,255,255,.16); border-radius:12px; padding:7px 10px; font-size:13px; font-weight:700; margin-bottom:10px}
.prizes+.lg-note{margin:8px 0 0}
.prizes{margin-top:10px; font-size:14px; font-weight:700; background:rgba(255,255,255,.18); border-radius:12px; padding:8px 10px; text-align:center}
.cups{display:flex; gap:14px; align-items:center; flex-wrap:wrap; font-family:var(--display); font-size:24px; color:var(--ink)}
.cups .small{font-family:var(--ui); font-size:14px}
.steps{padding-left:22px; margin:0} .steps li{margin-bottom:10px; font-weight:600}
.badges{display:flex; flex-wrap:wrap; gap:9px}
.badge{width:50px; height:50px; border-radius:16px; background:linear-gradient(140deg,var(--amber),var(--coral)); display:flex; align-items:center; justify-content:center; font-size:24px; box-shadow:0 4px 0 rgba(0,0,0,.14)}
.badge.off{background:var(--bg); filter:grayscale(1); opacity:.45; box-shadow:none}

.path{list-style:none; margin:16px 0 0; padding:0}
.stage{display:grid; grid-template-columns:52px 1fr; gap:10px; align-items:center; margin-bottom:10px}
.stage .num{width:44px; height:44px; margin:0 auto; border-radius:16px; color:#fff; font-family:var(--display); font-size:24px; display:flex; align-items:center; justify-content:center; background:var(--c); box-shadow:0 4px 0 rgba(0,0,0,.16)}
.stage button{text-align:left; background:var(--card); border:0; border-radius:20px; padding:13px 15px; width:100%; box-shadow:0 5px 0 var(--shade); border-left:7px solid var(--c)}
.stage button:active{transform:translateY(3px); box-shadow:0 2px 0 var(--shade)}
.stage button:disabled{opacity:.5; transform:none; box-shadow:0 5px 0 var(--shade)}
.stage:nth-child(8n+1){--c:var(--coral)} .stage:nth-child(8n+2){--c:var(--amber)}
.stage:nth-child(8n+3){--c:var(--teal)} .stage:nth-child(8n+4){--c:var(--violet)}
.stage:nth-child(8n+5){--c:var(--pink)} .stage:nth-child(8n+6){--c:var(--lime)}
.stage:nth-child(8n+7){--c:var(--sky)} .stage:nth-child(8n+8){--c:var(--plum)}
.stage h3{font-size:19px}
.stage .meta{display:flex; justify-content:space-between; margin-top:3px; font-size:14px; color:var(--muted)}
.stars{color:var(--gold); letter-spacing:2px; font-size:16px}
.linkbtn{background:var(--card); border:0; border-radius:14px; box-shadow:0 3px 0 var(--shade); color:var(--ink); font-weight:700; font-size:15px; padding:10px 14px; margin:16px 8px 0 0}

.sheet{background:var(--card); border-radius:24px; padding:18px; box-shadow:0 6px 0 var(--shade)}
.sheet h2{font-size:28px; color:var(--ink); margin-bottom:8px}
.story{background:linear-gradient(135deg,var(--violet),var(--sky)); color:#fff; border-radius:18px; padding:13px 15px; font-weight:700; font-size:17px; line-height:1.4; margin:8px 0 14px}
.theory p{margin:0 0 10px} .theory ul{margin:0 0 10px; padding-left:22px}
.theory b{color:var(--ink)}
.example{background:var(--bg); border-radius:16px; padding:12px 14px; margin:12px 0}
.example .r{display:flex; gap:12px; margin:6px 0}
.example .r span{flex:1; text-align:center; font-family:var(--display); font-size:22px; color:#fff; background:var(--violet); border-radius:12px; padding:4px}
.example .r span:last-child{background:var(--coral)}

.btn{display:block; width:100%; border:0; border-radius:20px; padding:15px; font-weight:800; font-size:18px; font-family:var(--display);
  background:linear-gradient(135deg,var(--violet),var(--sky)); color:#fff; box-shadow:0 5px 0 #3f2bb5; margin-top:14px}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 #3f2bb5}
.btn.ghost{background:var(--card); color:var(--ink); box-shadow:0 5px 0 var(--shade)}
.btn.ghost:active{box-shadow:0 1px 0 var(--shade)}
.btn:disabled{opacity:.45; transform:none}

.progress{display:flex; gap:5px; margin-bottom:14px}
.progress span{flex:1; height:9px; border-radius:6px; background:var(--card)}
.progress span.ok{background:var(--ok)} .progress span.bad{background:var(--bad)} .progress span.now{background:var(--violet)}
.hearts{font-size:19px} .combo{color:#fff; background:linear-gradient(135deg,var(--amber),var(--coral)); border-radius:999px; padding:4px 12px; font-weight:800; box-shadow:0 3px 0 rgba(0,0,0,.14)}
.task{position:relative; overflow:hidden}
.kind{font-size:14px; color:var(--muted); font-weight:700; margin-bottom:6px}
.q{font-size:20px; font-weight:700; margin:0 0 16px}
.opts{display:grid; gap:11px}
.opt{text-align:left; background:var(--bg); border:0; border-radius:16px; padding:13px 15px; width:100%; font-weight:600; box-shadow:0 4px 0 var(--line)}
.opt:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line)}
.opt.sel{background:rgba(124,92,255,.16); box-shadow:0 4px 0 var(--violet)}
.opt.right{background:var(--ok-bg); box-shadow:0 4px 0 var(--ok)}
.opt.wrong{background:var(--bad-bg); box-shadow:0 4px 0 var(--bad)}

.ledger{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px}
.ledger .h{text-align:center; font-family:var(--display); font-size:18px; color:#fff; border-radius:12px 12px 0 0; padding:5px; margin-bottom:-8px; position:relative; z-index:1}
.ledger .h:first-child{background:var(--violet)} .ledger .h:nth-child(2){background:var(--coral)}
.slot{min-height:86px; border:0; background:var(--bg); border-radius:0 0 16px 16px; padding:10px 8px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; font-size:13px; color:var(--muted); font-weight:600; box-shadow:0 4px 0 var(--line)}
.slot.active{box-shadow:0 4px 0 var(--gold), inset 0 0 0 3px var(--gold)}
.slot .hw{font-family:var(--display); font-size:34px; color:var(--ink); line-height:1.1}
.slot.right{background:var(--ok-bg); box-shadow:0 4px 0 var(--ok)}
.slot.wrong{background:var(--bad-bg); box-shadow:0 4px 0 var(--bad)}
.accs{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.acc{text-align:left; background:var(--bg); border:0; border-radius:14px; padding:9px 11px; font-size:13.5px; line-height:1.25; font-weight:600; box-shadow:0 4px 0 var(--line)}
.acc:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line)}
.acc code{display:block; font-family:var(--display); font-size:20px; color:var(--ink)}
.acc.used{opacity:.3}

.calc input{width:100%; font-family:var(--display); font-size:40px; font-weight:800; color:var(--ink); background:var(--bg); border:0; border-radius:16px; padding:8px 12px; box-shadow:0 4px 0 var(--line); text-align:center}
.calc .unit{font-size:14px; color:var(--muted); margin-top:8px; text-align:center; font-weight:600}

.stamp{position:absolute; right:12px; top:12px; transform:rotate(-12deg); pointer-events:none; border-radius:14px; padding:6px 14px; font-family:var(--display); font-weight:800; font-size:24px; color:#fff; animation:slam .4s cubic-bezier(.2,1.7,.4,1) both}
.stamp.ok{background:var(--ok)} .stamp.bad{background:var(--bad)}
@keyframes slam{from{transform:rotate(-12deg) scale(2.4); opacity:0} to{transform:rotate(-12deg) scale(1); opacity:1}}
.explain{margin-top:16px; border-radius:16px; padding:13px 15px; font-weight:600}
.explain.ok{background:var(--ok-bg); box-shadow:0 4px 0 var(--ok)}
.explain.bad{background:var(--bad-bg); box-shadow:0 4px 0 var(--bad)}
.explain b{display:block; margin-bottom:5px; font-family:var(--display); font-size:19px}
.explain.ok b{color:var(--ok)} .explain.bad b{color:var(--bad)}

.dock{position:fixed; left:0; right:0; bottom:0; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); background:linear-gradient(to top,var(--bg) 62%,transparent)}
.dock .btn{max-width:532px; margin:0 auto}
.dock .two{max-width:532px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:10px}
.dock .two .btn{margin-top:0; font-size:16px; padding:14px 8px}

.result{text-align:center}
.big-stars{font-size:56px; color:var(--gold); letter-spacing:6px; margin:4px 0}
.result h2{font-size:34px; color:var(--ink)}
.stats{display:flex; justify-content:center; gap:9px; flex-wrap:wrap; margin:14px 0}
.toast{position:fixed; left:50%; top:14px; transform:translateX(-50%); background:linear-gradient(135deg,var(--amber),var(--coral)); color:#fff; font-weight:800; padding:10px 18px; border-radius:999px; animation:pop 2.1s ease both; z-index:10; max-width:92vw; text-align:center; box-shadow:0 5px 0 rgba(0,0,0,.16)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-14px) scale(.9)}12%,80%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0}}
.coin{position:fixed; top:-30px; font-size:28px; animation:fall linear forwards; pointer-events:none; z-index:9}
@keyframes fall{to{transform:translateY(112vh) rotate(560deg)}}

.cert{background:var(--card); border-radius:24px; padding:22px; text-align:center; box-shadow:0 6px 0 var(--shade); border:5px dashed var(--violet)}
.cert h2{font-size:36px; color:var(--ink)}
.cert .nm{font-family:var(--display); font-size:34px; color:var(--coral); display:inline-block; padding:0 14px; border-bottom:3px solid var(--line)}
.set label{display:block; margin:14px 0 5px; font-weight:700}
.set input[type=time],.set input[type=text]{width:100%; padding:12px; font-size:17px; font-family:inherit; font-weight:700; border:0; border-radius:14px; background:var(--bg); color:var(--text); box-shadow:0 4px 0 var(--line)}
@media (prefers-reduced-motion:reduce){.stamp,.toast,.coin,.hero h1 span{animation:none}.coin{display:none}.btn:active,.opt:active,.acc:active,.stage button:active{transform:none}}
@media (max-width:380px){.hero h1{font-size:38px}.accs{grid-template-columns:1fr}}
</style>

function sHead(){ return {apikey:S.key,Authorization:"Bearer "+S.key,"Content-Type":"application/json"}; }
async function apiGet(q){

async function apiPost(body){

const PRIZE=[{xp:400,cup:"🏆",txt:"Liga g'olibi"},{xp:200,cup:"🥈",txt:"Ikkinchi o'rin"},{xp:100,cup:"🥉",txt:"Uchinchi o'rin"},{xp:40,cup:"🎗️",txt:"Ishtirok"}];
function goalPrize(xp){
  if(xp>=WEEK_GOAL) return {xp:400,cup:"🏆",txt:"Haftalik maqsad bajarildi"};
  if(xp>=WEEK_GOAL*0.6) return {xp:150,cup:"🥈",txt:"Maqsadga yaqin keldingiz"};
  if(xp>0) return {xp:50,cup:"🎗️",txt:"Ishtirok"};
  return {xp:0,cup:"😴",txt:"Bu hafta mashq bo'lmadi"};
}
function weekEnd(d){ // joriy liganing tugash vaqti: juma 12:00
  const t=new Date(d||new Date()), f=new Date(t);
  f.setHours(12,0,0,0);
  f.setDate(f.getDate()+((5-t.getDay()+7)%7));
  if(f<=t) f.setDate(f.getDate()+7);
  return f;
}
function weekId(d){ return weekEnd(d).toISOString().slice(0,16); }
function timeLeft(){
  const ms=weekEnd()-new Date();
  const d=Math.floor(ms/86400000), h=Math.floor(ms%86400000/3600000), m=Math.floor(ms%3600000/60000);
  return d>0?d+" kun "+h+" soat":(h>0?h+" soat "+m+" daq":m+" daqiqa");
}
function weekendNow(){ const n=new Date(), d=n.getDay();
  return d===6||d===0||(d===5&&n.getHours()>=12); }
function weekBoard(){
  if(players.length) return players.map(p=>({name:p.first_name+" "+(p.last_name||"").slice(0,1)+".",
    emoji:p.id===S.pid?"🧑":"👤",xp:(p.week_id===S.week.id?p.week_xp:0),me:p.id===S.pid}))
    .sort((a,b)=>b.xp-a.xp);
  return [{name:S.name||"Siz",emoji:"🧑",xp:S.week.my,me:true}];
}
function online(){ return players.length>1; }
function addXP(n){ S.xp+=n; S.week.my+=n; }
function d0(p){ return p+"-o'rin"; }
function checkWeek(){
  const id=weekId();
  if(!S.week.id){ S.week.id=id; persist(); return; }
  if(S.week.id===id) return;
  const wb=weekBoard(), pos=wb.findIndex(x=>x.me)+1;
  const pr=online()?PRIZE[Math.min(pos,4)-1]:goalPrize(S.week.my);
  S.lastWeekXp=S.week.my;
  S.pending={pos,xp:pr.xp,cup:pr.cup,txt:pr.txt,goal:!online(),my:S.week.my,
    board:wb.map(x=>({n:x.emoji+" "+x.name,x:x.xp,me:!!x.me}))};
  S.xp+=pr.xp;
  if(online()?pos<=3:S.week.my>=WEEK_GOAL*0.6) S.cups[(online()?pos:(S.week.my>=WEEK_GOAL?1:2))-1]++;
  S.leagues=(S.leagues||0)+1;
  if(online()?pos===1:S.week.my>=WEEK_GOAL) award("league");
  notify("🏁 Haftalik liga yakunlandi! "+pr.txt+" — +"+pr.xp+" XP. Yangi liga dushanbadan.");
  S.week={id,my:0,riv:{}}; RIVALS.forEach(r=>S.week.riv[r.id]=0);
  persist();
}

/* raqobatchilar o'sishi: har o'tgan kun uchun */
function simulate(){
  const now=Date.now();
  if(!S.sim){ S.sim=now; persist(); return []; }
  const days=Math.min(Math.floor((now-S.sim)/86400000),10);
  if(days<1) return [];
  const before=place();
  RIVALS.forEach(r=>{ for(let d=0;d<days;d++){ const g=Math.round(r.min+Math.random()*(r.max-r.min));
    S.riv[r.id]+=g; S.week.riv[r.id]=(S.week.riv[r.id]||0)+g; } });
  S.sim+=days*86400000;
  const after=place();
  persist();
  return after>before?[before,after]:[];
}
function board(){
  if(players.length) return players.map(p=>({id:p.id,name:p.first_name+" "+(p.last_name||"").slice(0,1)+".",
    emoji:p.id===S.pid?"🧑":"👤",tag:p.stages+" bosqich · "+p.streak+" kun seriya",xp:p.xp,me:p.id===S.pid}))
    .sort((a,b)=>b.xp-a.xp);
  return [{id:"me",name:S.name||"Siz",emoji:"🧑",tag:"Bu — siz",xp:S.xp,me:true}];
}
function place(){ return board().findIndex(x=>x.me)+1; }

const DEADLINE=17;                          // har kuni soat 17:00 gacha
const dstr=d=>d.toISOString().slice(0,10);
const isWorkday=d=>d.getDay()>=1&&d.getDay()<=5;
function deadlineLeft(){
  const n=new Date(), t=new Date(); t.setHours(DEADLINE,0,0,0);
  const ms=t-n; if(ms<=0) return null;
  const h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000);
  return h>0?h+" soat "+m+" daqiqa":m+" daqiqa";
}
function recalcStreak(){
  let n=0; const d=new Date();
  for(let i=0;i<90;i++){
    if(isWorkday(d)){ const v=S.days[dstr(d)]; if(v==="done"||v==="shield") n++; else break; }
    d.setDate(d.getDate()-1);
  }
  S.streak=n;
}
function sweepDays(){                        // bajarilmagan kunlarni "qoldirilgan" deb belgilash
  const now=new Date(), t=today();
  for(let i=1;i<=21;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    if(isWorkday(d)&&!S.days[dstr(d)]) S.days[dstr(d)]="missed";
  }
  if(isWorkday(now)&&!S.days[t]&&now.getHours()>=DEADLINE) S.days[t]="missed";
  Object.keys(S.days).forEach(k=>{                       // qalqon ishlatilsa kun saqlanadi
    if(S.days[k]==="missed"&&S.shield>0){ S.days[k]="shield"; S.shield--; toast("🛡️ Qalqon ishladi — seriya saqlandi"); }
  });
  recalcStreak(); persist();
}
function dayState(){                         // bugungi holat
  const now=new Date(), t=today();
  if(!isWorkday(now)) return {k:"off",txt:"Dam olish kuni — mashq ixtiyoriy"};
  const st=S.days[t];
  if(st==="done") return {k:"done",txt:"Bugungi mashq bajarildi ✅"};
  if(st==="shield") return {k:"done",txt:"🛡️ Qalqon ishlatildi — seriya saqlandi"};
  if(st==="missed"||st==="late"||now.getHours()>=DEADLINE) return {k:"missed",txt:"Bugungi mashq qoldirib yuborildi — 17:00 o'tdi"};
  return {k:"open",txt:"17:00 gacha "+deadlineLeft()+" qoldi"};
}
function markDay(){
  const t=today(), now=new Date();
  if(S.days[t]==="done") return 0;
  if(!isWorkday(now)){ S.days[t]="bonus"; S.last=t; persist(); return 0; }
  if(now.getHours()>=DEADLINE){ S.days[t]="late"; S.last=t; persist(); return 0; }
  S.days[t]="done"; S.last=t; recalcStreak();
  const bonus=Math.min(120,S.streak*12);
  addXP(bonus);
  if(S.streak>=3) award("streak3");
  if(S.streak>=7) award("streak7");
  persist();
  return bonus;
}
function dailyTick(ok){
  const t=today();
  if(S.daily.d!==t) S.daily={d:t,n:0,got:false};
  if(ok) S.daily.n++;
  if(S.daily.n>=15&&!S.daily.got){ S.daily.got=true; addXP(120); toast("🎯 Kunlik maqsad bajarildi! +120 XP"); }
  persist();
}

  if(giftDone()) return toast("Bugungi sovg'a olingan — ertaga yana");

  let pool=[]; open.forEach(i=>STAGES[i].tasks.forEach(t=>pool.push(t)));

  run={mode:"gift",si:null,queue:[q],total:1,i:0,lives:1,combo:0,mistakes:0,marks:[""],retried:new Set(),earned:0};
  task();

      :`<span class="hearts">${"❤️".repeat(r.lives)}${"🤍".repeat((r.mode==="daily"||r.mode==="errs"?5:3)-r.lives)}</span>`}<span class="spacer"></span>
    ${r.combo>=2?`<span class="combo">🔥 ×${r.combo}</span>`:""}<span class="pill">⚡ ${S.xp+r.earned}</span></div>
  <div class="progress">${r.marks.map((m,k)=>`<span class="${m||(k===t.k?"now":"")}"></span>`).join("")}</div>
  <article class="sheet task" id="card"><div class="kind">${({daily:"Kunlik mashq · ",blitz:"⚡ Blits · ",errs:"📕 Xato daftari · ",gift:"🎁 Sovg'a savoli · "})[r.mode]||""}${kind}${retry?" — takroriy":""}</div>
  <p class="q">${t.q}</p><div id="body"></div><div id="fb"></div></article>`;
  app.querySelector(".back").onclick=()=>{ if(confirm("Chiqasizmi? Natija saqlanmaydi.")){ clearInterval(r.tick); home(); } };
  if(r.mode==="blitz"){
    clearInterval(r.tick);
    r.tick=setInterval(()=>{
      const left=Math.max(0,Math.round((r.end-Date.now())/1000));
      const el=document.getElementById("tmr"); if(el) el.textContent="⏱ "+left;
      if(left<=0){ clearInterval(r.tick); finish(true); }
    },250);
  }
  const body=document.getElementById("body");
  if(t.t==="mc"){
    let opts=t.o.map((x,k)=>({x,c:k===t.a}));
    if(t.o.every(o=>/^\d{4}$/.test(o))){           // faqat hisobvaraq raqamlari bo'lsa — yana 2 ta chalg'ituvchi
      const pool=Object.keys(A).filter(c=>!t.o.includes(c));
      shuffle(pool).slice(0,2).forEach(c=>opts.push({x:c,c:false}));
    }
    r.opts=shuffle(opts); r.ans=r.opts.findIndex(o=>o.c);
    body.innerHTML=`<div class="opts">${r.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.x}</button>`).join("")}</div>`;
    body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(r.answered)return; r.pick=+b.dataset.k;
      body.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===b)); btn(true); });
    btn(false);
  }
  if(t.t==="pv"){
    let pv=[...t.o];
    const pool=Object.keys(A).filter(c=>!pv.includes(c));
    pv=pv.concat(shuffle(pool).slice(0,Math.max(0,8-pv.length)));
    const opts=shuffle(pv);
    body.innerHTML=`<div class="ledger"><div class="h">Debet</div><div class="h">Kredit</div>
      <button class="slot" data-side="dt"></button><button class="slot" data-side="kt"></button></div>
      <div class="accs">${opts.map(c=>`<button class="acc" data-c="${c}"><code>${c}</code>${A[c]}</button>`).join("")}</div>`;
    const draw=()=>{
      body.querySelectorAll(".slot").forEach(s=>{ const v=r.slots[s.dataset.side];
        s.classList.toggle("active",!r.answered&&r.active===s.dataset.side);
        s.innerHTML=v?`<span class="hw">${v}</span><span>${A[v]}</span>`:`<span>${r.active===s.dataset.side?"Hisobvaraqni tanlang":"Bo'sh"}</span>`; });
      body.querySelectorAll(".acc").forEach(a=>a.classList.toggle("used",a.dataset.c===r.slots.dt||a.dataset.c===r.slots.kt));
      btn(!!(r.slots.dt&&r.slots.kt));
    };
    body.querySelectorAll(".slot").forEach(s=>s.onclick=()=>{ if(r.answered)return; const side=s.dataset.side;
      if(r.slots[side])r.slots[side]=null; r.active=side; draw(); });
    body.querySelectorAll(".acc").forEach(a=>a.onclick=()=>{ if(r.answered)return; const c=a.dataset.c;
      if(r.slots.dt===c)r.slots.dt=null; if(r.slots.kt===c)r.slots.kt=null;
      r.slots[r.active]=c; r.active=!r.slots.dt?"dt":(!r.slots.kt?"kt":r.active); draw(); });
    draw();
  }
  if(t.t==="calc"){
    body.innerHTML=`<div class="calc"><input id="num" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="Javob">
      <div class="unit">${t.unit||"so'm"} — faqat raqam</div></div>`;
    const inp=document.getElementById("num");
    inp.oninput=()=>{const d=inp.value.replace(/\D/g,""); inp.value=d?fmt(+d):""; btn(!!d);};
    inp.onkeydown=e=>{ if(e.key==="Enter"&&inp.value) check(); };
    btn(false);
  }
  window.scrollTo(0,0);
}
function btn(on){ setDock(`<button class="btn" id="chk" ${on?"":"disabled"}>Tekshirish</button>`); document.getElementById("chk").onclick=check; }

function check(){
  const r=run,t=r.queue[r.i]; if(r.answered)return; r.answered=true;
  let ok=false,right="";
  const body=document.getElementById("body");
  if(t.t==="mc"){ ok=r.pick===r.ans;
    body.querySelectorAll(".opt").forEach((b,k)=>{ if(k===r.ans)b.classList.add("right"); else if(k===r.pick)b.classList.add("wrong"); }); }
  if(t.t==="pv"){ ok=r.slots.dt===t.dt&&r.slots.kt===t.kt;
    body.querySelectorAll(".slot").forEach(s=>{const side=s.dataset.side; s.classList.remove("active");
      s.classList.add(r.slots[side]===t[side]?"right":"wrong");});
    right=`To'g'ri provodka: <b style="display:inline">Dt ${t.dt} — Kt ${t.kt}</b><br>`; }
  if(t.t==="calc"){ const v=+document.getElementById("num").value.replace(/\D/g,""); ok=v===t.a;
    document.getElementById("num").disabled=true;
    right=`To'g'ri javob: <b style="display:inline">${fmt(t.a)} ${t.unit||"so'm"}</b><br>`; }
  const card=document.getElementById("card"), st=document.createElement("div");
  st.className="stamp "+(ok?"ok":"bad"); st.textContent=ok?"TO'G'RI":"XATO"; card.appendChild(st);
  if(ok){
    r.combo++;
    let g=(r.i>=r.total?5:(r.mode==="daily"?8:10)); if(r.combo>=3)g+=5; if(r.combo>=7)g+=5;
    r.earned+=g; if(r.marks[t.k]!=="bad")r.marks[t.k]="ok";
    if(r.combo===3)toast("🔥 3 ketma-ket! +5 bonus");
    if(r.combo===5){toast("🚀 5 ketma-ket!");award("combo5");}
    if(r.combo===7)toast("💎 7 ketma-ket! +10 bonus");
    if(r.combo===10)award("combo10");
    dailyTick(true);
    if(r.mode==="blitz") r.right++;
    if(t.id&&S.errs[t.id]&&(r.mode==="errs"||r.mode==="daily")){ delete S.errs[t.id]; persist(); }
    const p=["Barakalla!","Aniq hisob!","Balans joyida!","Zo'r!","Professional daraja!","Inspektor ham rozi!"];
    document.getElementById("fb").innerHTML=`<div class="explain ok"><b>${p[Math.floor(Math.random()*p.length)]} +${g} XP</b>${t.e}</div>`;
  } else {
    r.combo=0; if(r.mode!=="blitz") r.lives--; r.mistakes++; r.marks[t.k]="bad";
    if(t.id){ S.errs[t.id]=true; persist(); }
    if(!r.retried.has(t.k)){r.retried.add(t.k); r.queue.push(t);}
    if(navigator.vibrate)try{navigator.vibrate(120);}catch(e){}
    card.classList.add("shake"); setTimeout(()=>card.classList.remove("shake"),600);
    document.getElementById("fb").innerHTML=`<div class="explain bad"><b>Unchalik emas — keling, tushunib olamiz</b>${right}${t.e}</div>`;
  }
  const last=r.i>=r.queue.length-1;
  if(r.mode==="gift"){
    setDock(`<button class="btn" id="nx">🎁 Sovg'ani ochish</button>`);
    document.getElementById("nx").onclick=()=>giftReward(ok);
  } else if(r.mode==="blitz"){
    setDock(`<button class="btn" id="nx">Keyingi savol</button>`);
    const go=()=>{ if(Date.now()>=r.end) return; if(last) return finish(true); r.i++; task(); };
    document.getElementById("nx").onclick=go;
    setTimeout(()=>{ if(run===r&&r.answered) go(); },1100);
  } else {
  setDock(`<button class="btn" id="nx">${r.lives<=0?"Natijani ko'rish":(last?"Yakunlash":"Davom etish")}</button>`);
  document.getElementById("nx").onclick=()=>{ if(r.lives<=0)return finish(false); if(last)return finish(true); r.i++; task(); };
  }
  document.getElementById("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}

function finish(passed){
  const r=run; clearInterval(r.tick);
  if(r.mode==="blitz"){
    const rec=r.right>(S.blitz||0); if(rec) S.blitz=r.right;
    addXP(r.earned); markDay(); persist();
    app.innerHTML=`<section class="sheet result"><div style="font-size:60px">⚡</div>
      <h2>Blits yakunlandi!</h2>
      <div class="stats"><span class="pill">✅ ${r.right} to'g'ri</span><span class="pill">⚡ +${r.earned} XP</span>
      <span class="pill">🏅 rekord: ${S.blitz}</span></div>
      ${rec?`<p class="story">Yangi rekord! 🎉</p>`:`<p class="small">Rekordni yangilash uchun ${S.blitz-r.right+1} ta ko'proq javob kerak.</p>`}</section>`;
    if(rec) coins();
    setDock(`<div class="two"><button class="btn" id="a">Yana blits</button><button class="btn ghost" id="b">Asosiy</button></div>`);
    document.getElementById("a").onclick=()=>startBlitz(STAGES.map((x,i)=>i).filter(unlocked));
    document.getElementById("b").onclick=home; window.scrollTo(0,0); return;
  }
  const posBefore=place();
  if(passed){
    const stars=r.mistakes===0?3:(r.mistakes===1?2:1);
    let bonus=r.mode==="stage"?stars*30:70;
    addXP(r.earned+bonus);
    if(r.mode==="stage"){
      const prev=S.stars[r.si]||0; S.stars[r.si]=Math.max(prev,stars);
      award("first"); if(stars===3)award("perfect");
      if(Object.keys(S.stars).length>=4)award("half");
      if(Object.keys(S.stars).length>=STAGES.length)award("all");
      if(S.failed[r.si])award("comeback");
    } else { S.dailyRuns=(S.dailyRuns||0)+1; if(S.dailyRuns>=5)award("daily5"); }
    const dayBonus=markDay();
    persist(); sync();
    if(place()===1)award("lead");
    const posAfter=place(), moved=posBefore-posAfter;
    const b=board(), me=b[posAfter-1], above=posAfter>1?b[posAfter-2]:null;
    app.innerHTML=`<section class="sheet result">
      <div class="big-stars">${r.mode==="stage"?starStr(stars):"🎯"}</div>
      <h2>${r.mode==="daily"?"Kunlik mashq bajarildi!":(r.si===STAGES.length-1?"Tekshiruvdan o'tdingiz!":"Bosqich yakunlandi!")}</h2>
      <div class="stats"><span class="pill">⚡ +${r.earned+bonus+dayBonus} XP</span>
        <span class="pill">❌ ${r.mistakes} xato</span><span class="pill">🔥 ${S.streak} kun</span></div>
      ${dayBonus?`<p class="small">Kunlik seriya bonusi: +${dayBonus} XP</p>`:""}
      <div class="card" style="margin:14px 0 0"><h3>Reyting</h3><div class="lb">
        ${b.map((x,k)=>`<div class="row ${x.me?"me":""}"><span class="pos">${["🥇","🥈","🥉","4"][k]}</span>
        <span class="who">${x.emoji} ${x.name}</span><span class="xp">${x.xp} XP</span></div>`).join("")}</div>
        <div class="gap ${moved>0?"up":(above?"down":"up")}">${moved>0?`${moved} pog'ona ko'tarildingiz! 🎉`:(above?`${above.name}gacha ${above.xp-me.xp} XP qoldi.`:"Siz yetakchisiz — ushlab turing!")}</div></div>
    </section>`;
    coins();
    const nx=r.mode==="stage"&&r.si+1<STAGES.length&&unlocked(r.si+1);
    setDock(`<div class="two"><button class="btn" id="a">${nx?"Keyingi bosqich":"Xaritaga"}</button><button class="btn ghost" id="b">Xaritaga</button></div>`);
    document.getElementById("a").onclick=()=>nx?intro(r.si+1):home();
    document.getElementById("b").onclick=home;
  } else {
    if(r.mode==="stage"){S.failed[r.si]=true; persist();}
    const b=board();
    app.innerHTML=`<section class="sheet result"><div class="big-stars">🤍🤍🤍</div>
      <h2>Jonlar tugadi</h2><p>Har bir bosh buxgalter ham shu yerdan o'tgan. Nazariyani ko'rib, qayta urinib ko'ring.</p>
      <div class="stats"><span class="pill">✅ ${r.marks.filter(m=>m==="ok").length} to'g'ri</span><span class="pill">❌ ${r.mistakes} xato</span></div>
      <p class="small">${b[0].me?"Siz hali yetakchisiz.":b[0].name+" hozir 1-o'rinda ("+b[0].xp+" XP)."}</p></section>`;
    setDock(`<div class="two"><button class="btn" id="a">Qayta boshlash</button><button class="btn ghost" id="b">Xaritaga</button></div>`);
    document.getElementById("a").onclick=()=>r.mode==="stage"?intro(r.si):home();
    document.getElementById("b").onclick=home;
  }
  window.scrollTo(0,0);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------------- ishga tushirish ---------------- */
overtake=simulate();
checkWeek();
if(S.user.first&&!S.pid) joinServer().then(()=>pullPlayers(true)); else pullPlayers(true);
if(S.pending) leagueResult(); else home();
scheduleReminder();
scheduleLeague();
if(S.last!==today()&&S.xp>0) setTimeout(()=>toast("Bugungi mashq hali bajarilmagan 🔥"),900);
</script>
</body>
</html>
