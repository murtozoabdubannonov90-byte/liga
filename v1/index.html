<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hisobchi Liga</title>
<meta name="theme-color" content="#7C5CFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F2FF; --dot:#E0D8FF; --card:#FFFFFF; --line:#E4DCFF; --shade:#D9CFFF;
  --ink:#4B2FD6; --text:#241F40; --muted:#6F6796;
  --coral:#FF6B5A; --amber:#FFB020; --teal:#0FB8A1; --violet:#7C5CFF; --pink:#FF5FA2; --lime:#4CC14B; --sky:#2FA8FF; --plum:#B054FF;
  --ok:#0FA25C; --ok-bg:#E0F8EC; --bad:#E8433B; --bad-bg:#FFE6E3; --gold:#FFB020;
  --display:"Baloo 2","Segoe UI",system-ui,sans-serif;
  --ui:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15123A; --dot:#241F55; --card:#1F1B4A; --line:#332C6B; --shade:#120F30;
    --ink:#C6B6FF; --text:#F0EDFF; --muted:#A49CD1;
    --ok:#3EDD8C; --ok-bg:#12372A; --bad:#FF7E72; --bad-bg:#3D1C24; --gold:#FFC44D;
  }
}
:root[data-theme="dark"]{--bg:#15123A;--dot:#241F55;--card:#1F1B4A;--line:#332C6B;--shade:#120F30;--ink:#C6B6FF;--text:#F0EDFF;--muted:#A49CD1;--ok:#3EDD8C;--ok-bg:#12372A;--bad:#FF7E72;--bad-bg:#3D1C24;}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  background-image:radial-gradient(var(--dot) 1.6px, transparent 1.6px);
  background-size:20px 20px;
  color:var(--text); font-family:var(--ui); font-size:17px; line-height:1.5; min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
body::before{content:""; position:fixed; inset:-20% -20% auto -20%; height:70vh; z-index:-2; pointer-events:none;
  background:radial-gradient(45% 45% at 20% 25%, rgba(124,92,255,.45), transparent 70%),
             radial-gradient(40% 40% at 80% 15%, rgba(47,168,255,.38), transparent 70%),
             radial-gradient(45% 45% at 60% 60%, rgba(255,95,162,.30), transparent 70%);
  filter:blur(40px); animation:aurora 18s ease-in-out infinite alternate}
body::after{content:""; position:fixed; inset:auto -20% -25% -20%; height:55vh; z-index:-2; pointer-events:none;
  background:radial-gradient(40% 40% at 30% 70%, rgba(15,184,161,.32), transparent 70%),
             radial-gradient(40% 40% at 75% 60%, rgba(255,176,32,.30), transparent 70%);
  filter:blur(46px); animation:aurora 22s ease-in-out infinite alternate-reverse}
@keyframes aurora{0%{transform:translate3d(-4%,-2%,0) scale(1)}50%{transform:translate3d(5%,3%,0) scale(1.12)}100%{transform:translate3d(-2%,4%,0) scale(1.05)}}
.wrap{max-width:560px; margin:0 auto; padding:12px 14px 124px}
.wrap>*{animation:rise .5s cubic-bezier(.2,.8,.3,1) both}
.wrap>*:nth-child(2){animation-delay:.05s} .wrap>*:nth-child(3){animation-delay:.1s}
.wrap>*:nth-child(4){animation-delay:.15s} .wrap>*:nth-child(5){animation-delay:.2s}
.wrap>*:nth-child(6){animation-delay:.25s} .wrap>*:nth-child(7){animation-delay:.3s}
@keyframes rise{from{opacity:0; transform:translateY(18px) scale(.98)}to{opacity:1; transform:none}}
@keyframes popin{from{opacity:0; transform:scale(.8)}to{opacity:1; transform:none}}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.shake{animation:shake .5s both}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
.ring{position:relative; width:170px; height:170px; margin:4px auto 6px}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring circle{fill:none; stroke-width:13; stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.22)}
.ring .fg{stroke:#fff; stroke-dasharray:327; stroke-dashoffset:327; transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.3,1)}
.ring-t{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center}
.ring-t b{font-family:var(--display); font-size:38px; line-height:1}
.ring-t i{font-style:normal; font-size:14px; font-weight:700; opacity:.9}
.podium{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; align-items:end; margin:8px 0 4px}
.pod{border-radius:16px 16px 0 0; padding:10px 6px 12px; text-align:center; color:#fff; animation:rise .6s both}
.pod span{display:block; font-size:24px}
.pod b{display:block; font-size:14px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pod i{font-style:normal; font-size:12px; opacity:.92}
.pod.p1{background:linear-gradient(160deg,#FFD75E,#FF9A2E); height:130px; animation-delay:.1s}
.pod.p2{background:linear-gradient(160deg,#D9DEF0,#9AA3C7); height:106px}
.pod.p3{background:linear-gradient(160deg,#F0B98C,#C67C4E); height:92px; animation-delay:.2s}
.nav button{transition:transform .18s, background .25s, color .25s}
.nav button.on{transform:translateY(-3px)}
.nav button.on span{animation:popin .3s both}
.appbar .ava{animation:popin .4s both}
.appbar{position:sticky; top:8px; z-index:5; display:flex; align-items:center; gap:11px; background:var(--card); border-radius:20px; padding:9px 13px; margin-bottom:14px; box-shadow:0 4px 0 var(--shade)}
.ava{width:42px; height:42px; border-radius:14px; background:linear-gradient(140deg,var(--violet),var(--sky)); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:800; font-size:19px}
.ttl b{display:block; font-family:var(--display); font-size:18px; line-height:1.15}
.ttl i{font-style:normal; font-size:13px; color:var(--muted); font-weight:600}
.xpchip{margin-left:auto; background:linear-gradient(135deg,var(--amber),var(--coral)); color:#fff; font-weight:800; border-radius:999px; padding:6px 13px; font-size:15px; white-space:nowrap}
.nav{max-width:532px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:6px; background:var(--card); border-radius:22px; padding:8px 6px; box-shadow:0 4px 0 var(--shade)}
.nav button{border:0; background:none; border-radius:16px; padding:7px 2px; font-size:12px; font-weight:700; color:var(--muted); display:grid; gap:3px; justify-items:center}
.nav button span{font-size:21px; line-height:1}
.nav button.on{background:linear-gradient(135deg,var(--violet),var(--sky)); color:#fff}
.dl{display:flex; align-items:center; gap:12px; border-radius:22px; padding:14px 16px; color:#fff; box-shadow:0 5px 0 rgba(0,0,0,.16); margin-bottom:14px}
.dl.open{background:linear-gradient(135deg,#FF8A3D,var(--coral))}
.dl.done{background:linear-gradient(135deg,var(--lime),var(--teal))}
.dl.missed{background:linear-gradient(135deg,#8B87A6,#5A5674)}
.dl.off{background:linear-gradient(135deg,var(--sky),var(--violet))}
.dl-l b{display:block; font-family:var(--display); font-size:19px}
.dl-l i{font-style:normal; font-size:14px; opacity:.95; font-weight:600}
.dl-r{margin-left:auto; text-align:center; font-family:var(--display); font-size:34px; line-height:1}
.dl-r span{display:block; font-size:12px; font-family:var(--ui); opacity:.92; font-weight:700}
.acts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
.act{background:var(--bg); border:0; border-radius:16px; padding:11px 8px; font-weight:700; font-size:14px; line-height:1.25; box-shadow:0 4px 0 var(--line); display:grid; gap:2px; justify-items:center; text-align:center}
.act span{font-size:24px} .act i{font-style:normal; font-size:12px; color:var(--muted); font-weight:600}
.act:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line)}
.act.dim{opacity:.5} .act.gift{background:linear-gradient(140deg,var(--amber),var(--coral)); color:#fff; box-shadow:0 4px 0 #c9500f}
.act.gift i{color:rgba(255,255,255,.9)}
.goal{background:rgba(255,255,255,.18); border-radius:16px; padding:12px; text-align:center}
.goal-n{font-family:var(--display); font-size:30px; line-height:1.1}
.goal-bar{height:12px; background:rgba(0,0,0,.18); border-radius:8px; margin:8px 0 6px; overflow:hidden}
.goal-bar i{display:block; height:100%; background:#fff; border-radius:8px; transition:width .6s}
.goal-t{font-size:14px; font-weight:700}
.tmr{background:linear-gradient(135deg,var(--coral),var(--pink)); color:#fff; font-weight:800; border-radius:999px; padding:5px 13px}
.tmr.low{animation:pulse 1s infinite}
.stats2{display:grid;gap:7px}.statrow{display:grid;grid-template-columns:1fr 70px 42px;gap:8px;align-items:center;font-size:13.5px;font-weight:600}
.statrow i{height:9px;border-radius:6px;background:linear-gradient(90deg,var(--lime) var(--w),var(--bg) var(--w))}.statrow b{text-align:right;color:var(--ink)}
.champ{display:grid;gap:3px;padding:9px 11px;border-radius:14px;background:var(--bg);margin-bottom:8px;font-weight:700;font-size:14.5px}.champ .me{color:var(--violet)}
@media print{.bar,#dock,.nav,.noprint{display:none!important} body{background:#fff} .cert{box-shadow:none} .rep{box-shadow:none;padding:0}}
.set textarea{min-height:84px;resize:vertical;font-size:15px}
.task,.task *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.wm{position:absolute;inset:-30%;pointer-events:none;opacity:.07;font-weight:800;font-size:13px;line-height:2.3;transform:rotate(-20deg);word-break:break-all;color:var(--ink);z-index:0}
.task>*:not(.wm):not(.stamp){position:relative;z-index:1}
.fair{background:var(--bg);border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:600;margin-top:10px}
.wq{border:2px solid var(--violet)} .wq .q{margin:8px 0 12px}
.card.fin{background:linear-gradient(140deg,#2a1f6b,#5b3cc4 60%,#a04cd6)!important;color:#fff} .card.fin>.small,.card.fin h3,.card.fin>.small b{color:#fff} .card.fin .lb .row{background:#fff;color:var(--ink)} .card.fin .lb .row.me{background:#FFF1C9;border-color:var(--amber)}
.topics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:10px} .topics .act{font-size:13px}
.rep table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px} .rep th,.rep td{border:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
.rep th{background:var(--bg);font-size:11px} .rep td.n{text-align:right;white-space:nowrap} .rep .sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.rep .sum div{background:var(--bg);border-radius:12px;padding:8px;text-align:center;font-size:12px} .rep .sum b{display:block;font-family:var(--display);font-size:18px}
.repwrap{overflow-x:auto}
@page rep{size:A4 landscape;margin:10mm} .rep{page:rep}
.paycard{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:linear-gradient(135deg,#2a1f6b,#5b3cc4);color:#fff;border-radius:16px;padding:14px 16px;margin-top:8px}
.paycard{grid-template-columns:1fr!important} .paycard b{font-family:var(--display);font-size:19px;letter-spacing:.5px;white-space:nowrap;font-variant-numeric:tabular-nums} .paycard i{font-style:normal;font-size:13px;opacity:.85} .paycard .buy{justify-self:start;margin-top:6px}
.upl{display:block;text-align:center;margin-top:8px;padding:12px;border-radius:14px;border:2px dashed var(--line);font-weight:800;cursor:pointer}
#rprev[hidden]{display:none} #rprev{display:block;max-width:100%;max-height:260px;margin:10px auto 0;border-radius:12px}
.rcpt{display:grid;grid-template-columns:96px 1fr;gap:12px;background:var(--bg);border-radius:16px;padding:10px;margin-bottom:8px}
.rcpt img{width:96px;height:120px;object-fit:cover;border-radius:10px;cursor:zoom-in} .rcpt img.big{grid-column:1/-1;width:100%;height:auto;object-fit:contain}
.rcpt b{display:block;font-family:var(--display);font-size:15px} .rcpt i{display:block;font-style:normal;font-size:12.5px;color:var(--muted);font-weight:600}
.wqo{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;margin-top:8px} .wqo b{font-family:var(--display)}
.adm{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--bg);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.adm b{display:block;font-family:var(--display);font-size:16px}.adm i{font-style:normal;font-size:12.5px;color:var(--muted);font-weight:600;display:block;line-height:1.35}
.del{border:0;border-radius:12px;padding:8px 12px;font-weight:800;color:#fff;background:var(--bad)}
@keyframes pulse{50%{opacity:.55}}
.week7{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; text-align:center}
.week7 span{border-radius:12px; padding:10px 0; font-size:12px; font-weight:800; background:var(--bg); color:var(--muted)}
.week7 .d{background:var(--ok); color:#fff} .week7 .m{background:var(--bad); color:#fff}
.week7 .s{background:var(--violet); color:#fff} .week7 .b{background:var(--amber); color:#fff}
.shop{display:flex; align-items:center; gap:10px; background:var(--bg); border-radius:16px; padding:11px 13px; margin-bottom:10px}
.shop b{display:block; font-family:var(--display); font-size:17px} .shop i{font-style:normal; font-size:13px; color:var(--muted); font-weight:600}
.buy{margin-left:auto; border:0; border-radius:999px; padding:9px 16px; font-weight:800; color:#fff; background:linear-gradient(135deg,var(--violet),var(--sky)); box-shadow:0 3px 0 #3f2bb5; white-space:nowrap}
.rules{padding-left:20px; margin:0} .rules li{margin-bottom:9px; font-size:15px}
.reg{margin-top:18px} .reglogo{font-size:58px; text-align:center} .reg h2{text-align:center}
button{font-family:inherit; font-size:inherit; color:inherit; cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--violet); outline-offset:3px}
h1,h2,h3{margin:0; line-height:1.1; font-family:var(--display); font-weight:800}
.small{font-size:14px; color:var(--muted); line-height:1.4}

.bar{display:flex; align-items:center; gap:10px; padding:4px 0 12px}
.bar .back{border:0; background:var(--card); box-shadow:0 3px 0 var(--shade); border-radius:14px; font-size:22px; width:42px; height:42px; line-height:1}
.pill{display:inline-flex; align-items:center; gap:6px; background:var(--card); border-radius:999px; padding:5px 14px; font-weight:700; font-size:15px; box-shadow:0 3px 0 var(--shade)}
.spacer{flex:1}

.hero{padding:10px 4px 2px}
.hero h1{font-size:46px; color:var(--ink); letter-spacing:-.5px}
.hero h1 span{display:inline-block; animation:wiggle 3s ease-in-out infinite}
@keyframes wiggle{0%,92%,100%{transform:rotate(0)}95%{transform:rotate(-14deg)}98%{transform:rotate(12deg)}}
.hero p{margin:6px 0 0; color:var(--muted); max-width:38ch}

.card{background:var(--card); border-radius:22px; padding:16px; margin:14px 0 0; box-shadow:0 5px 0 var(--shade)}
.card h3{font-size:19px; margin-bottom:10px; color:var(--ink)}
.rank-top{display:flex; justify-content:space-between; align-items:center; gap:8px}
.rank-top b{font-family:var(--display); font-size:24px; color:var(--ink)}
.meter{height:14px; background:var(--bg); border-radius:10px; margin-top:12px; overflow:hidden}
.meter i{display:block; height:100%; border-radius:10px; background:linear-gradient(90deg,var(--amber),var(--coral)); transition:width .6s cubic-bezier(.3,1.4,.5,1)}

.lb{display:grid; gap:8px}
.row{display:grid; grid-template-columns:36px 1fr auto; gap:10px; align-items:center; padding:9px 11px; border-radius:16px; background:var(--bg)}
.row.me{background:linear-gradient(90deg,rgba(124,92,255,.18),rgba(47,168,255,.14)); box-shadow:inset 0 0 0 2.5px var(--violet)}
.row .pos{font-size:22px; text-align:center}
.row .who{font-weight:700}
.row .who i{display:block; font-style:normal; font-size:13px; color:var(--muted); font-weight:400}
.row .xp{font-weight:800; color:var(--ink); white-space:nowrap}
.gap{margin-top:10px; font-size:15px; font-weight:600}
.gap.up{color:var(--ok)} .gap.down{color:var(--coral)}
.alert{background:linear-gradient(135deg,var(--coral),var(--pink)); color:#fff; border-radius:18px; padding:13px 15px; margin-top:14px; font-weight:700; box-shadow:0 5px 0 rgba(0,0,0,.14)}

.parts{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px}
.parts>div{border-radius:16px; padding:10px 4px; text-align:center; background:rgba(127,127,127,.12)}
.parts b{display:block; font-family:var(--display); font-size:22px; line-height:1.1}
.parts i{display:block; font-style:normal; font-size:11px; opacity:.8; margin-top:3px}
.league .parts>div{background:rgba(255,255,255,.16); color:#fff}
.days{margin-top:10px; display:grid; gap:6px}
.days>div{display:flex; justify-content:space-between; align-items:center; border-radius:14px; padding:8px 12px; background:rgba(127,127,127,.12); font-size:14px}
.league .days>div{background:rgba(255,255,255,.16); color:#fff}
.days b{font-family:var(--display)}
.days .dim{opacity:.6}
.parts>div.tot{outline:3px solid rgba(255,196,0,.9)}
.parts>div.bz{outline:2px dashed rgba(127,127,127,.45)}
.league .parts>div.bz{outline-color:rgba(255,255,255,.55)}
.psub{display:block; font-style:normal; font-size:11px; opacity:.75; margin-top:2px}
.duo{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px}
.duo>div{border-radius:22px; padding:14px 10px; text-align:center; color:#fff; box-shadow:0 5px 0 rgba(0,0,0,.15)}
.duo>div:first-child{background:linear-gradient(140deg,#FF8A3D,var(--coral))}
.duo>div:last-child{background:linear-gradient(140deg,var(--teal),#2FA8FF)}
.duo .n{font-family:var(--display); font-size:44px; line-height:1}
.duo .small{color:rgba(255,255,255,.92); font-weight:600}

.league{background:linear-gradient(140deg,#7C5CFF,#B054FF 55%,#FF5FA2); color:#fff; border-radius:22px; padding:16px; margin-top:14px; box-shadow:0 5px 0 rgba(0,0,0,.18)}
.league h3{font-size:20px; color:#fff}
.lg-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px}
.lg-timer{background:rgba(255,255,255,.22); border-radius:999px; padding:4px 12px; font-weight:800; font-size:14px; white-space:nowrap}
.league .row{background:rgba(255,255,255,.16)}
.league .row.me{background:rgba(255,255,255,.34); box-shadow:inset 0 0 0 2.5px #fff}
.league .row .xp,.league .row .who{color:#fff}
.league .gap{color:#fff !important; font-weight:700}
.privacy{margin:10px 2px 0; font-size:13px; color:var(--muted); font-weight:600}
.lg-note{background:rgba(255,255,255,.16); border-radius:12px; padding:7px 10px; font-size:13px; font-weight:700; margin-bottom:10px}
.prizes+.lg-note{margin:8px 0 0}
.prizes{margin-top:10px; font-size:14px; font-weight:700; background:rgba(255,255,255,.18); border-radius:12px; padding:8px 10px; text-align:center}
.cups{display:flex; gap:14px; align-items:center; flex-wrap:wrap; font-family:var(--display); font-size:24px; color:var(--ink)}
.cups .small{font-family:var(--ui); font-size:14px}
.steps{padding-left:22px; margin:0} .steps li{margin-bottom:10px; font-weight:600}
.badges{display:flex; flex-wrap:wrap; gap:9px}
.badge{width:50px; height:50px; border-radius:16px; background:linear-gradient(140deg,var(--amber),var(--coral)); display:flex; align-items:center; justify-content:center; font-size:24px; box-shadow:0 4px 0 rgba(0,0,0,.14)}
.badge.off{background:var(--bg); filter:grayscale(1); opacity:.45; box-shadow:none}

.path{list-style:none; margin:16px 0 0; padding:0}
.stage{display:grid; grid-template-columns:52px 1fr; gap:10px; align-items:center; margin-bottom:10px}
.stage .num{width:44px; height:44px; margin:0 auto; border-radius:16px; color:#fff; font-family:var(--display); font-size:24px; display:flex; align-items:center; justify-content:center; background:var(--c); box-shadow:0 4px 0 rgba(0,0,0,.16)}
.stage button{text-align:left; background:var(--card); border:0; border-radius:20px; padding:13px 15px; width:100%; box-shadow:0 5px 0 var(--shade); border-left:7px solid var(--c)}
.stage button:active{transform:translateY(3px); box-shadow:0 2px 0 var(--shade)}
.stage button:disabled{opacity:.5; transform:none; box-shadow:0 5px 0 var(--shade)}

    R=>{const x=M(R,20,500),a=x*12/100; return calc(`Oylik ish haqi fondi ${N(x)} so'm. Ijtimoiy soliq 12%. Ijtimoiy soliq summasi?`,a,`${N(x)} × 12% = ${N(a)} so'm. Ijtimoiy soliq xodimdan ushlanmaydi — firma o'zi to'laydi.`);},
    R=>{const x=K(R,30,150),p=pick(R,[10,20,25,30,40,50]),a=x+x*p/100; return calc(`Xodimning okladi ${N(x)} so'm, mukofot okladning ${p}%. Jami hisoblangan ish haqi?`,a,`${N(x)} + ${p}% (${N(x*p/100)}) = ${N(a)} so'm.`);},
    R=>{const x=22*ri(R,15,90)*10000,d=ri(R,8,21),a=x/22*d; return calc(`Okladi ${N(x)} so'm, oyda 22 ish kuni. Xodim ${d} kun ishladi. Hisoblangan ish haqi?`,a,`${N(x)} ÷ 22 × ${d} = ${N(a)} so'm.`);},
    R=>{const x=K(R,40,200),z=K(R,2,10),a=x*88/100-z; return calc(`Ish haqi ${N(x)} so'm, JShDS 12%, ijro varaqasi bo'yicha ushlanma ${N(z)} so'm. Qo'lga beriladigan summa?`,a,`${N(x)} − ${N(x*12/100)} (JShDS) − ${N(z)} = ${N(a)} so'm.`);},
    R=>{const d=ri(R,150,900)*1000,n=pick(R,[15,21,24,30]),a=d*n; return calc(`Xodimning o'rtacha kunlik ish haqi ${N(d)} so'm. Ta'til ${n} kalendar kun. Ta'til puli?`,a,`${N(d)} × ${n} = ${N(a)} so'm.`);},
    R=>{const x=M(R,20,400),a=x*112/100; return calc(`Ish haqi fondi ${N(x)} so'm. Ijtimoiy soliq 12% bilan firmaning ish haqi bo'yicha jami xarajati?`,a,`${N(x)} + 12% = ${N(a)} so'm.`);},
    R=>pv(R,`Ishlab chiqarish ishchilariga ${N(K(R,50,900))} so'm ish haqi hisoblandi.`,"2010","6710","Ishchilar ish haqi mahsulot tannarxiga kiradi (Dt 2010), xodimlarga qarz (Kt 6710)."),
    R=>pv(R,`Ma'muriyat xodimlariga ${N(K(R,50,900))} so'm ish haqi hisoblandi.`,"9420","6710","Ma'muriyat ish haqi — davr xarajati (Dt 9420), xodimlarga qarz (Kt 6710)."),
    R=>pv(R,`Sotish bo'limi xodimlariga ${N(K(R,50,900))} so'm ish haqi hisoblandi.`,"9410","6710","Sotish bo'limi ish haqi — sotish xarajati (Dt 9410), xodimlarga qarz (Kt 6710)."),
    R=>pv(R,`Ish haqidan ${N(K(R,5,90))} so'm JShDS ushlandi.`,"6710","6410","Xodimga qarz kamayadi (Dt 6710), budjetga qarz oshadi (Kt 6410)."),
    R=>pv(R,`${N(K(R,30,900))} so'm ish haqi xodimlarning bank kartalariga o'tkazildi.`,"6710","5110","Xodimlarga qarz yopiladi (Dt 6710), bank hisobi kamayadi (Kt 5110)."),
    R=>pv(R,`Kassadan ${N(K(R,10,90))} so'm ish haqi naqd berildi.`,"6710","5010","Xodimlarga qarz yopiladi (Dt 6710), kassa kamayadi (Kt 5010)."),
    R=>pv(R,`Xodim yetkazgan ${N(K(R,1,20))} so'm moddiy zarar uning ish haqidan ushlandi.`,"6710","4730","Ish haqi qarzi kamayadi (Dt 6710), xodimning moddiy zarar qarzi yopiladi (Kt 4730).")]},
  av:{icon:"🏭",title:"Asosiy vositalar",n:40,tpl:[
    R=>{const n=pick(R,[4,5,8,10]),l=M(R,0,5),x=l+n*M(R,2,40),a=(x-l)/n; return calc(`Uskunaning boshlang'ich qiymati ${N(x)} so'm, tugatish qiymati ${N(l)} so'm, foydali xizmat muddati ${n} yil. To'g'ri chiziqli usulda YILLIK amortizatsiya?`,a,`(${N(x)} − ${N(l)}) ÷ ${n} = ${N(a)} so'm.`);},
    R=>{const n=pick(R,[2,3,4,5]),l=K(R,0,20),x=l+n*12*K(R,1,30),a=(x-l)/(n*12); return calc(`Kompyuter qiymati ${N(x)} so'm, tugatish qiymati ${N(l)} so'm, xizmat muddati ${n} yil. To'g'ri chiziqli usulda OYLIK amortizatsiya?`,a,`(${N(x)} − ${N(l)}) ÷ (${n} × 12) = ${N(a)} so'm.`);},
    R=>{const x=M(R,50,500),y=M(R,5,x/1e6-10); return calc(`Bino boshlang'ich qiymati ${N(x)} so'm, to'plangan eskirish ${N(y)} so'm. Qoldiq (balans) qiymati?`,x-y,`${N(x)} − ${N(y)} = ${N(x-y)} so'm.`);},
    R=>{const b=M(R,10,200),s=b+M(R,1,50); return calc(`Qoldiq qiymati ${N(b)} so'm bo'lgan uskuna ${N(s)} so'mga (QQSsiz) sotildi. Chiqib ketishdan foyda?`,s-b,`Sotish qiymati − qoldiq qiymat = ${N(s)} − ${N(b)} = ${N(s-b)} so'm.`);},
    R=>{const n=pick(R,[4,5,8,10]),k=ri(R,5,50),x=n*k*1e6,a=x*2/n; return calc(`Avtomobil qiymati ${N(x)} so'm, xizmat muddati ${n} yil, tugatish qiymati 0. Ikki baravar kamayuvchi qoldiq usulida 1-YIL amortizatsiyasi?`,a,`Stavka = 2 ÷ ${n} = ${Math.round(200/n)}%. ${N(x)} × 2 ÷ ${n} = ${N(a)} so'm.`);},
    R=>{const u=pick(R,[10000,20000,50000,100000]),k=ri(R,50,500),x=u*k,v=ri(R,1000,u/2); return calc(`Stanok qiymati ${N(x)} so'm, butun xizmat davrida ${N(u)} dona mahsulot chiqaradi. Bu yil ${N(v)} dona chiqardi. Ishlab chiqarish hajmi usulida amortizatsiya?`,k*v,`1 donaga: ${N(x)} ÷ ${N(u)} = ${k} so'm. ${k} × ${N(v)} = ${N(k*v)} so'm.`);},
    R=>{const p=M(R,20,300),t=K(R,5,50),m=K(R,5,80); return calc(`Uskuna narxi ${N(p)} so'm (QQSsiz), yetkazib berish ${N(t)} so'm, o'rnatish va sozlash ${N(m)} so'm. Kirim QQS hisobga olinadi. Boshlang'ich qiymat?`,p+t+m,`Foydalanishga tayyorlashgacha bo'lgan barcha xarajatlar: ${N(p)} + ${N(t)} + ${N(m)} = ${N(p+t+m)} so'm.`);},
    R=>pv(R,`Yetkazib beruvchidan ${N(M(R,10,300))} so'mlik uskuna olindi (QQSsiz).`,"0820","6010","Hali foydalanishga topshirilmagan uskuna — kapital qo'yilma (Dt 0820), yetkazib beruvchiga qarz (Kt 6010)."),
    R=>pv(R,`${N(M(R,10,300))} so'mlik uskuna foydalanishga topshirildi.`,"0130","0820","Asosiy vosita tan olinadi (Dt 0130), kapital qo'yilma yopiladi (Kt 0820)."),
    R=>pv(R,`Sex uskunasiga ${N(K(R,5,90))} so'm amortizatsiya hisoblandi.`,"2010","0230","Sex uskunasi eskirishi mahsulot tannarxiga (Dt 2010), to'plangan eskirish oshadi (Kt 0230)."),
    R=>pv(R,`Ofis kompyuterlariga ${N(K(R,2,40))} so'm amortizatsiya hisoblandi.`,"9420","0230","Ofis jihozlari eskirishi — ma'muriy xarajat (Dt 9420), to'plangan eskirish (Kt 0230)."),
    R=>pv(R,`Chiqib ketgan uskunaning ${N(M(R,5,90))} so'm to'plangan eskirishi hisobdan chiqarildi.`,"0230","0130","Eskirish yopiladi (Dt 0230), asosiy vosita qiymati kamayadi (Kt 0130)."),
    R=>pv(R,`Chiqib ketgan uskunaning ${N(M(R,5,90))} so'm qoldiq qiymati hisobdan chiqarildi.`,"9210","0130","Qoldiq qiymat chiqib ketish hisobvarag'iga (Dt 9210), asosiy vosita kamayadi (Kt 0130).")]},
  tmz:{icon:"📦",title:"Zaxiralar",n:40,tpl:[
    R=>{const a=ri(R,10,50),p1=ri(R,10,50)*1000,b=ri(R,10,60),p2=p1+ri(R,1,10)*1000,c=ri(R,a+1,a+b),v=a*p1+(c-a)*p2;
      return calc(`Oy boshida ${a} dona × ${N(p1)} so'm qoldiq, keyin ${b} dona × ${N(p2)} so'mdan kirim. ${c} dona chiqim qilindi. FIFO usulida chiqim tannarxi?`,v,`Avval eski partiya: ${a} × ${N(p1)} = ${N(a*p1)}; qolgani ${c-a} × ${N(p2)} = ${N((c-a)*p2)}. Jami ${N(v)} so'm.`);},
    R=>{const a=ri(R,10,40),m=ri(R,10,60)*1000,d=ri(R,1,9)*1000,c=ri(R,5,2*a),v=c*m;
      return calc(`Qoldiq ${a} dona × ${N(m-d)} so'm, kirim ${a} dona × ${N(m+d)} so'm. ${c} dona chiqim. O'rtacha tortilgan tannarx usulida chiqim summasi?`,v,`O'rtacha narx = (${N(a*(m-d))} + ${N(a*(m+d))}) ÷ ${2*a} = ${N(m)}. ${c} × ${N(m)} = ${N(v)} so'm.`);},
    R=>{const p=M(R,10,200),t=K(R,2,40),b=K(R,2,60); return calc(`Material narxi ${N(p)} so'm (QQSsiz), transport ${N(t)} so'm, bojxona to'lovlari ${N(b)} so'm. Kirim QQS hisobga olinadi. Materialning haqiqiy tannarxi?`,p+t+b,`Xarid bilan bog'liq barcha xarajatlar: ${N(p)} + ${N(t)} + ${N(b)} = ${N(p+t+b)} so'm.`);},
    R=>{const q1=ri(R,100,500),q2=q1-ri(R,3,30),p=ri(R,5,90)*1000; return calc(`Inventarizatsiya: hisob bo'yicha ${q1} dona, haqiqatda ${q2} dona. 1 dona tannarxi ${N(p)} so'm. Kamomad summasi?`,(q1-q2)*p,`(${q1} − ${q2}) × ${N(p)} = ${N((q1-q2)*p)} so'm.`);},
    R=>{const s=M(R,10,90),k=M(R,20,150),c=M(R,10,(s+k)/1e6-5); return calc(`1010: oy boshi qoldig'i ${N(s)} so'm, oyda kirim ${N(k)} so'm, ishlab chiqarishga berildi ${N(c)} so'm. Oy oxiri qoldig'i?`,s+k-c,`Aktiv hisobvaraq: ${N(s)} + ${N(k)} − ${N(c)} = ${N(s+k-c)} so'm.`);},
    R=>{const x=M(R,20,200),y=x-M(R,1,15); return calc(`Tovar tannarxi ${N(x)} so'm, sof sotish qiymati ${N(y)} so'm. MHXS (IAS 2) bo'yicha qadrsizlanish summasi?`,x-y,`Zaxira tannarx va sof sotish qiymatining kichigida baholanadi: ${N(x)} − ${N(y)} = ${N(x-y)} so'm.`);},
    R=>pv(R,`Yetkazib beruvchidan ${N(M(R,2,90))} so'mlik materiallar kirim qilindi.`,"1010","6010","Materiallar ko'paydi (Dt 1010), yetkazib beruvchiga qarz (Kt 6010)."),
    R=>pv(R,`${N(M(R,2,90))} so'mlik materiallar asosiy ishlab chiqarishga berildi.`,"2010","1010","Ishlab chiqarish xarajati (Dt 2010), ombordagi material kamayadi (Kt 1010)."),
    R=>pv(R,`Ofis ehtiyojlari uchun ${N(K(R,2,40))} so'mlik kanselyariya hisobdan chiqarildi.`,"9420","1010","Ofis ehtiyoji — ma'muriy xarajat (Dt 9420), material kamayadi (Kt 1010)."),
    R=>pv(R,`Inventarizatsiyada ${N(K(R,2,40))} so'mlik materiallar kamomadi aniqlandi.`,"5910","1010","Kamomad avval 5910 ga yig'iladi (Dt 5910), material kamayadi (Kt 1010)."),
    R=>pv(R,`${N(K(R,2,40))} so'mlik kamomad aybdor xodim zimmasiga yuklandi.`,"4730","5910","Xodim qarzi (Dt 4730), kamomad hisobvarag'i yopiladi (Kt 5910)."),
    R=>pv(R,`Sotish uchun ${N(M(R,5,150))} so'mlik tovarlar kirim qilindi.`,"2910","6010","Tovarlar ko'paydi (Dt 2910), yetkazib beruvchiga qarz (Kt 6010)."),
    R=>pv(R,`Sotilgan tovarlarning ${N(M(R,5,150))} so'm tannarxi hisobdan chiqarildi.`,"9120","2910","Sotilgan tovar tannarxi (Dt 9120), ombordagi tovar kamayadi (Kt 2910)."),
    R=>pv(R,`Ishlab chiqarishdan ${N(M(R,5,150))} so'mlik tayyor mahsulot omborga kirim qilindi.`,"2810","2010","Tayyor mahsulot (Dt 2810), ishlab chiqarish xarajati yopiladi (Kt 2010)."),
    R=>pv(R,`Inventarizatsiyada ${N(K(R,2,40))} so'mlik materiallar ortiqchasi aniqlandi.`,"1010","9390","Ortiqcha material kirim qilinadi (Dt 1010) — boshqa operatsion daromad (Kt 9390).")]},
  sol:{icon:"🏛️",title:"Soliqlar",n:40,tpl:[
    R=>{const x=K(R,50,5000),a=x*15/100; return calc(`Soliq solinadigan foyda ${N(x)} so'm, foyda solig'i stavkasi 15%. Foyda solig'i?`,a,`${N(x)} × 15% = ${N(a)} so'm.`);},
    R=>{const x=M(R,20,500),y=M(R,1,40),a=(x+y)*15/100; return calc(`Buxgalteriya foydasi ${N(x)} so'm, chegirilmaydigan xarajatlar ${N(y)} so'm. Foyda solig'i 15%. Soliq summasi?`,a,`Soliq bazasi = ${N(x)} + ${N(y)} = ${N(x+y)}. × 15% = ${N(a)} so'm.`);},
    R=>{const x=K(R,20,900),a=x*4/100; return calc(`Aylanmadan olinadigan soliq stavkasi 4%. Oylik tushum ${N(x)} so'm. Soliq summasi?`,a,`${N(x)} × 4% = ${N(a)} so'm.`);},
    R=>{const x=M(R,5,300),a=x*95/100; return calc(`Jismoniy shaxs ta'sischiga ${N(x)} so'm dividend hisoblandi, 5% soliq ushlanadi. Ta'sischiga to'lanadigan summa?`,a,`${N(x)} − 5% = ${N(a)} so'm.`);},
    R=>{const x=K(R,5,200),d=ri(R,5,60),a=x*33/100000*d; return calc(`Soliq qarzi ${N(x)} so'm, ${d} kun kechiktirildi. Masala sharti: penya kuniga 0,033%. Penya summasi?`,a,`${N(x)} × 0,033% × ${d} = ${N(a)} so'm.`);},
    R=>{const x=M(R,100,2000),r=pick(R,[1,1.5,2]),a=x*r/100; return calc(`Mol-mulkning o'rtacha yillik qiymati ${N(x)} so'm. Masala sharti: stavka ${String(r).replace(".",",")}%. Yillik mol-mulk solig'i?`,a,`${N(x)} × ${String(r).replace(".",",")}% = ${N(a)} so'm.`);},
    R=>pv(R,`Yil yakunida ${N(M(R,2,90))} so'm foyda solig'i hisoblandi.`,"9810","6410","Foyda solig'i xarajati (Dt 9810), budjetga qarz (Kt 6410)."),
    R=>pv(R,`Budjetga ${N(M(R,2,90))} so'm soliq bank orqali to'landi.`,"6410","5110","Budjetga qarz yopiladi (Dt 6410), bank hisobi kamayadi (Kt 5110)."),
    R=>pv(R,`Ta'sischilarga ${N(M(R,5,200))} so'm dividend e'lon qilindi.`,"8710","6610","Taqsimlanmagan foyda kamayadi (Dt 8710), dividend qarzi paydo bo'ladi (Kt 6610)."),
    R=>pv(R,`Dividenddan ${N(K(R,5,90))} so'm soliq ushlandi.`,"6610","6410","Ta'sischiga qarz kamayadi (Dt 6610), budjetga qarz oshadi (Kt 6410)."),
    R=>pv(R,`Ta'sischilarga ${N(M(R,5,200))} so'm dividend bank orqali to'landi.`,"6610","5110","Dividend qarzi yopiladi (Dt 6610), bank kamayadi (Kt 5110).")]},
  mhxs:{icon:"🌐",title:"MHXS",n:0,tpl:[

function simulate(){
  const now=Date.now();
  if(!S.sim){ S.sim=now; persist(); return []; }
  const days=Math.min(Math.floor((now-S.sim)/86400000),10);
  if(days<1) return [];
  const before=place();
  RIVALS.forEach(r=>{ for(let d=0;d<days;d++){ const g=Math.round(r.min+Math.random()*(r.max-r.min));
    S.riv[r.id]+=g; S.week.riv[r.id]=(S.week.riv[r.id]||0)+g; } });
  S.sim+=days*86400000;
  const after=place();
  persist();
  return after>before?[before,after]:[];
}

const DEF_START="2026-09-28";
function ymd(str){ const [y,m,d]=String(str).split("-").map(Number); return new Date(y,m-1,d); }
function ligaStart(){ return ymd((S.group&&S.group.start)||DEF_START); }
const isWd=d=>d.getDay()>=1&&d.getDay()<=5;
function addWorkdays(d0,n){ const d=new Date(d0); while(!isWd(d)) d.setDate(d.getDate()+1); while(n>0){ d.setDate(d.getDate()+1); if(isWd(d)) n--; } return d; }
function workdaysBefore(start,end){ let n=0; const d=new Date(start); while(d<end){ if(isWd(d)) n++; d.setDate(d.getDate()+1); } return n; }
function season(){ const st=ligaStart(), t=ymd(tzNow().day); if(t<=st) return 0; return Math.floor(workdaysBefore(st,t)/12); }
const WDN=["Yakshanba","Dushanba","Seshanba","Chorshanba","Payshanba","Juma","Shanba"];
function stageDate(i){ return addWorkdays(ligaStart(), season()*12+i); }
function stageDay(i){ const d=stageDate(i); return WDN[d.getDay()]+", "+String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0"); }
/* vaqt — Toshkent (UTC+5), telefon mintaqasidan qat'i nazar */
const OPEN_H=9, CLOSE_H=17;
function tzNow(){ const t=new Date(Date.now()+5*3600e3); return {day:t.toISOString().slice(0,10), h:t.getUTCHours()+t.getUTCMinutes()/60}; }
const dkey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
/* "future" — hali ochilmagan, "open" — hozir ochiq (o'z kuni 09:00–17:00), "closed" — yopilgan */
function stageState(i){ const n=tzNow(), k=dkey(stageDate(i));
  if(k>n.day||(k===n.day&&n.h<OPEN_H)) return "future";
  if(k===n.day&&n.h<CLOSE_H) return "open";
  return "closed"; }
const stageOpen=i=>stageState(i)==="open";
const unlocked=i=>stageState(i)!=="future";   // savollari kunlik mashq/blits uchun ochilganmi
const openStages=()=>{ const o=STAGES.map((x,i)=>i).filter(unlocked); return o.length?o:[0]; };
const starStr=n=>"★".repeat(n)+"☆".repeat(3-n);

const DEADLINE=17;                          // har kuni soat 17:00 gacha
const dstr=d=>d.toISOString().slice(0,10);
const isWorkday=d=>d.getDay()>=1&&d.getDay()<=5;
const isWeekend=()=>{const d=new Date().getDay(); return d===0||d===6;};
const WKMSG="Shanba va yakshanba ish kunlari savollari yopiq — qo'shimcha mashq qiling";
function deadlineLeft(){
  const n=new Date(), t=new Date(); t.setHours(DEADLINE,0,0,0);
  const ms=t-n; if(ms<=0) return null;
  const h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000);
  return h>0?h+" soat "+m+" daqiqa":m+" daqiqa";
}
function recalcStreak(){
  let n=0; const d=new Date();
  for(let i=0;i<90;i++){
    if(isWorkday(d)){ const v=S.days[dstr(d)]; if(v==="done"||v==="shield") n++; else break; }
    d.setDate(d.getDate()-1);
  }
  S.streak=n;
}
function sweepDays(){                        // bajarilmagan kunlarni "qoldirilgan" deb belgilash
  const now=new Date(), t=today();
  for(let i=1;i<=21;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    if(isWorkday(d)&&!S.days[dstr(d)]) S.days[dstr(d)]="missed";
  }
  if(isWorkday(now)&&!S.days[t]&&now.getHours()>=DEADLINE) S.days[t]="missed";
  Object.keys(S.days).forEach(k=>{                       // qalqon ishlatilsa kun saqlanadi
    if(S.days[k]==="missed"&&S.shield>0){ S.days[k]="shield"; S.shield--; toast("🛡️ Qalqon ishladi — seriya saqlandi"); }
  });
  recalcStreak(); persist();
}
function dayState(){                         // bugungi holat
  const now=new Date(), t=today();
  if(!isWorkday(now)) return {k:"off",txt:"Dam olish kuni — faqat qo'shimcha mashq (XP berilmaydi)"};
  const st=S.days[t];
  if(st==="done") return {k:"done",txt:"Bugungi mashq bajarildi ✅"};
  if(st==="shield") return {k:"done",txt:"🛡️ Qalqon ishlatildi — seriya saqlandi"};
  if(st==="missed"||st==="late"||now.getHours()>=DEADLINE) return {k:"missed",txt:"Bugungi mashq qoldirib yuborildi — 17:00 o'tdi"};
  return {k:"open",txt:"17:00 gacha "+deadlineLeft()+" qoldi"};
}
function markDay(){
  const t=today(), now=new Date();
  if(S.days[t]==="done") return 0;
  if(!isWorkday(now)){ S.days[t]="bonus"; S.last=t; persist(); return 0; }
  if(now.getHours()>=DEADLINE){ S.days[t]="late"; S.last=t; persist(); return 0; }
  S.days[t]="done"; S.last=t; recalcStreak();
  const bonus=Math.min(120,S.streak*12);
  addXP(bonus);
  if(S.streak>=3) award("streak3");
  if(S.streak>=7) award("streak7");
  persist();
  return bonus;
}
function dailyTick(ok){
  const t=today();
  if(S.daily.d!==t) S.daily={d:t,n:0,got:false};
  if(ok) S.daily.n++;
  if(S.daily.n>=15&&!S.daily.got){ S.daily.got=true; addXP(120); toast("🎯 Kunlik maqsad bajarildi! +120 XP"); }
  persist();
}

function countUp(el,to,ms){
  if(!el) return; const t=+to||0, st=performance.now();
  const step=n=>{ const p=Math.min(1,(n-st)/(ms||900)); el.textContent=Math.round(t*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function statsHTML(){
  const per={}; let ok=0, bad=0;
  Object.keys(S.sa||{}).forEach(k=>{ const si=+k.split("|")[1], m=S.sa[k].m||{};
    Object.values(m).forEach(v=>{ per[si]=per[si]||{ok:0,bad:0}; per[si][v==="ok"?"ok":"bad"]++; v==="ok"?ok++:bad++; }); });
  const tot=ok+bad; if(!tot) return "";
  const rows=Object.keys(per).map(Number).sort((a,b)=>a-b).map(si=>{ const p=per[si], n=p.ok+p.bad, pc=Math.round(p.ok/n*100);

  const weak=Object.keys(per).map(Number).filter(si=>per[si].ok+per[si].bad>=5).sort((a,b)=>per[a].ok/(per[a].ok+per[a].bad)-per[b].ok/(per[b].ok+per[b].bad))[0];
  return `<section class="card"><h3>📊 Statistika</h3>

function finalSet(){ const f=S.fin||{}, R=srng(hstr("final|"+f.month+"|"+((S.group&&S.group.code)||"")));
  const pool=TOPIC_ALL().concat(STAGES.reduce((a,st)=>a.concat(st.tasks.slice(12)),[]));
  const mix=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const all=mix(pool), take=(t,n)=>all.filter(x=>x.t===t).slice(0,n);
  return mix(take("pv",8).concat(take("calc",6),take("mc",6))).map((t,k)=>({...t,k})); }
function startFinal(){
  if(!finalCanPlay()) return toast("Final hozir yopiq");
  const f=S.fin; S.finDone=S.finDone||{}; S.finDone[f.month]=true;
  const q=finalSet();
  run={mode:"final",noXP:true,si:null,queue:q,total:q.length,i:0,lives:99,combo:0,mistakes:0,marks:q.map(()=>""),retried:new Set(),earned:0,right:0,done:0,started:Date.now(),month:f.month};
  saveFinalRun(run); task(); }
function saveFinalRun(r){ S.finRun={month:r.month,right:r.right||0,done:r.done||0,ms:Date.now()-r.started,sent:false}; persist(); }
async function sendFinal(fr){ try{ await rpc("liga_final_submit",{p_id:S.pid,p_token:S.token,p_score:fr.right*20,p_ms:fr.ms}); fr.sent=true; persist(); return true; }
  catch(e){ if(/final_closed|not_qualified/.test(String(e.message))){ fr.sent=true; persist(); } return false; } }
function flushFinal(){ const fr=S.finRun; if(fr&&!fr.sent&&S.pid&&S.token) sendFinal(fr); }   // ilova yopilib qolgan bo'lsa — natija yuboriladi
async function finishFinal(r){ clearInterval(r.tick); run=null; saveFinalRun(r);

function shrinkImage(file){ return new Promise((res,rej)=>{ const fr=new FileReader();
  fr.onerror=()=>rej(new Error("bad_image"));
  fr.onload=()=>{ const im=new Image(); im.onerror=()=>rej(new Error("bad_image"));
    im.onload=()=>{ let w=im.naturalWidth, h=im.naturalHeight; const k=Math.min(1,1200/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
      const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,w,h); x.drawImage(im,0,0,w,h);
      let q=.75, d=c.toDataURL("image/jpeg",q); while(d.length>1400000&&q>.3){ q-=.15; d=c.toDataURL("image/jpeg",q); } res(d); };
    im.src=fr.result; };
  fr.readAsDataURL(file); }); }

  // bosqichlar: yulduzga qarab (3★ ≈ 450, 2★ ≈ 380, 1★ ≈ 280)
  const est={3:450,2:380,1:280}, stg={};
  Object.keys(S.stars||{}).forEach(k=>{ const i=+k, d=stageDate(i);
    if(weekId(new Date(d.getTime()+12*3600e3))===S.week.id) stg[i]=est[S.stars[k]]||280; });
  let stage=Object.values(stg).reduce((a,b)=>a+b,0);
  let blitz=(S.blitz||0)*12;
  let daily=(S.dailyRuns||0)*150;
  const need=stage+blitz+daily, room=Math.max(0,my-bonus);
  if(need>room&&need>0){ const k=room/need; stage=Math.round(stage*k); blitz=Math.round(blitz*k); daily=Math.round(daily*k);
    Object.keys(stg).forEach(i=>stg[i]=Math.round(stg[i]*k)); }
  else { // ortib qolgani — blits/kunlik mashqqa (bir necha marta o'ynalgan bo'lishi mumkin)
    let extra=room-need; if(S.blitz) { blitz+=extra; extra=0; } else if(S.dailyRuns){ daily+=extra; extra=0; } }
  const sk=Object.keys(stg); if(sk.length){ const sum=sk.reduce((a,i)=>a+stg[i],0); if(sum!==stage) stg[sk[sk.length-1]]+=stage-sum; }
  S.week.part={stage,daily,blitz}; S.week.stages=stg; S.week.est=true;
  S.stageXP=S.stageXP||{}; Object.keys(stg).forEach(i=>{ if(!S.stageXP[i]) S.stageXP[i]=stg[i]; });
  persist(); setTimeout(sync,1500);
})();
(function blitzOut(){ // bir martalik: avval jamiga qo'shilgan blits balini chiqarib olish
  if(S.blitzFix1) return; S.blitzFix1=true;
  const b=(S.week.part&&S.week.id===weekId())?(S.week.part.blitz||0):0;
  if(b>0){ S.week.my=Math.max(0,S.week.my-b); S.xp=Math.max(0,S.xp-b); S.blitzXP=(S.blitzXP||0)+b; }
  persist(); if(b>0) setTimeout(sync,1800);
})();
(function stageOnlyTotal(){ // bir martalik: jamini faqat bosqich baliga tushirish, qolganini alohida qilish
  if(S.totalFix1) return; S.totalFix1=true;
  const P=S.week.part||(S.week.part={stage:0,daily:0,blitz:0});
  if(S.week.id===weekId()&&S.week.my>0){
    const st=P.stage||0, dl=P.daily||0;
    P.bonus=(P.bonus||0)+Math.max(0,S.week.my-st-dl);
    S.week.my=st; setTimeout(sync,2100);
  }
  persist();
})();
if(S.last!==today()&&S.xp>0) setTimeout(()=>toast("Bugungi mashq hali bajarilmagan 🔥"),900);
</script>
